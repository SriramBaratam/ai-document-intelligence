<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Document Quiz · AI Document Intelligence</title>
<style>
:root{--bg:#f6f7fb;--panel:#fff;--soft:#f0f2f6;--text:#151922;--muted:#697386;--line:#e5e7eb;--brand:#635bff;--brand2:#5148e8;--good:#12b76a;--bad:#f04438;--shadow:0 20px 60px rgba(15,23,42,.10)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#eeecff 0,transparent 40%),var(--bg);color:var(--text);font:14px Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{width:min(900px,calc(100% - 32px));margin:auto;padding:28px 0 50px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.brand{display:flex;align-items:center;gap:11px}.logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--brand),#8b5cf6);color:#fff;font-weight:900}.brand b{display:block}.brand span{font-size:11px;color:var(--muted)}a{color:var(--muted);text-decoration:none}.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:28px}.intro{text-align:center;padding:44px 28px}.icon{width:68px;height:68px;border-radius:20px;background:#eeecff;color:var(--brand);display:grid;place-items:center;margin:0 auto 18px;font-size:30px}.intro h1{font-size:34px;letter-spacing:-1.4px;margin:0}.intro p{color:var(--muted);max-width:620px;margin:10px auto 24px;line-height:1.7}.prompt{display:flex;gap:8px;max-width:700px;margin:auto}.prompt input{flex:1;height:48px;border:1px solid var(--line);border-radius:12px;padding:0 14px;outline:0;background:var(--soft);color:var(--text)}button{border:0;border-radius:11px;background:var(--brand);color:#fff;font-weight:850;padding:0 17px;cursor:pointer}button:hover{background:var(--brand2)}button:disabled{opacity:.5;cursor:not-allowed}.settings{display:flex;justify-content:center;gap:8px;margin-top:12px}.select{height:38px;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:0 10px;color:var(--text)}.hidden{display:none}.progress{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:12px}.bar{height:7px;background:var(--soft);border-radius:999px;overflow:hidden;margin-bottom:26px}.fill{height:100%;background:linear-gradient(90deg,var(--brand),#8b5cf6);transition:.3s}.question{font-size:23px;font-weight:850;line-height:1.35;letter-spacing:-.5px;margin-bottom:20px}.options{display:grid;gap:10px}.option{width:100%;text-align:left;min-height:56px;padding:12px 15px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;display:flex;align-items:center;gap:12px}.option:hover{border-color:#635bff66;background:#faf9ff}.letter{width:29px;height:29px;border-radius:8px;background:var(--soft);display:grid;place-items:center;font-weight:900;color:var(--muted);flex:0 0 29px}.option.correct{border-color:#12b76a66;background:#f0fdf6}.option.correct .letter{background:#dcfae6;color:#087443}.option.wrong{border-color:#f0443866;background:#fff5f4}.option.wrong .letter{background:#fee4e2;color:#b42318}.feedback{margin-top:17px;padding:14px;border-radius:12px;font-size:12px;line-height:1.6}.feedback.good{background:#f0fdf6;color:#087443}.feedback.bad{background:#fff5f4;color:#b42318}.nextrow{display:flex;justify-content:space-between;align-items:center;margin-top:18px}.source{color:var(--muted);font-size:10px}.result{text-align:center;padding:40px}.score{font-size:58px;font-weight:900;letter-spacing:-3px;color:var(--brand);margin:10px}.stats{display:flex;justify-content:center;gap:10px;margin:22px 0}.stat{padding:12px 18px;background:var(--soft);border-radius:12px}.stat b{display:block;font-size:18px}.stat span{font-size:10px;color:var(--muted)}.error{color:var(--bad);background:#fff5f4;padding:12px;border-radius:10px;margin-top:14px;font-size:11px}.loading{display:inline-flex;align-items:center;gap:8px}.spinner{width:14px;height:14px;border:2px solid #ffffff66;border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body><div class="wrap">
<header class="top"><div class="brand"><div class="logo">AI</div><div><b>Document Intelligence</b><span>Grounded Quiz Agent</span></div></div><a href="/">← Back to workspace</a></header>
<section id="start" class="card intro"><div class="icon">🎓</div><h1>Test your knowledge</h1><p>Ask naturally. The quiz agent uses your indexed documents, understands your request, and asks one question at a time.</p><div class="prompt"><input id="instruction" value="Conduct a quiz for me" placeholder="e.g. Test me on chapter 2 with 5 hard questions"><button id="startBtn">Start Quiz</button></div><div class="settings"><select id="count" class="select"><option value="5">5 questions</option><option value="10" selected>10 questions</option><option value="15">15 questions</option></select><select id="difficulty" class="select"><option value="mixed" selected>Mixed difficulty</option><option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Hard</option></select></div><div id="startError" class="error hidden"></div></section>
<section id="quiz" class="card hidden"><div class="progress"><span id="counter"></span><span id="scoreText">Score 0</span></div><div class="bar"><div id="fill" class="fill" style="width:0"></div></div><div id="question" class="question"></div><div id="options" class="options"></div><div id="feedback" class="feedback hidden"></div><div class="nextrow"><span id="source" class="source"></span><button id="next" class="hidden">Next question →</button></div></section>
<section id="result" class="card result hidden"><div class="icon">🏆</div><h1>Quiz complete</h1><div id="score" class="score">0 / 0</div><div class="stats"><div class="stat"><b id="accuracy">0%</b><span>Accuracy</span></div><div class="stat"><b id="correct">0</b><span>Correct</span></div><div class="stat"><b id="wrong">0</b><span>Needs review</span></div></div><button onclick="location.reload()">Take another quiz</button></section>
</div>
<script>
const API='http://localhost:8000';
let questions=[],index=0,score=0,answered=false;
const $=id=>document.getElementById(id);
function parseInstruction(text){
  const n=text.match(/\b(\d{1,2})\s*(?:questions?|q)\b/i);
  const d=text.match(/\b(easy|medium|hard|difficult)\b/i);
  const difficulty=d?(d[1].toLowerCase()==='difficult'?'hard':d[1].toLowerCase()):$('difficulty').value;
  return {num_questions:n?Math.min(20,Math.max(3,+n[1])):+$('count').value,difficulty,instruction:text.trim()||'Conduct a quiz for me'};
}
async function readError(response){
  try{const data=await response.json();return data.detail||data.message||`Request failed (${response.status})`;}catch{return `Request failed (${response.status})`;}
}
$('startBtn').onclick=async()=>{
  const btn=$('startBtn');btn.disabled=true;btn.innerHTML='<span class="loading"><span class="spinner"></span>Creating quiz…</span>';$('startError').classList.add('hidden');
  try{
    const cfg=parseInstruction($('instruction').value);
    const r=await fetch(API+'/quiz/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(cfg)});
    if(!r.ok)throw new Error(await readError(r));
    const data=await r.json();questions=data.questions||[];
    if(questions.length<3)throw new Error('Not enough grounded questions were generated from the indexed documents.');
    index=0;score=0;$('start').classList.add('hidden');$('quiz').classList.remove('hidden');render();
  }catch(e){$('startError').textContent=e.message;$('startError').classList.remove('hidden');}
  finally{btn.disabled=false;btn.textContent='Start Quiz';}
};
$('instruction').addEventListener('keydown',e=>{if(e.key==='Enter')$('startBtn').click();});
function render(){
  answered=false;const q=questions[index];$('counter').textContent=`Question ${index+1} of ${questions.length}`;$('scoreText').textContent=`Score ${score}`;$('fill').style.width=((index+1)/questions.length*100)+'%';$('question').textContent=q.question;$('source').textContent=q.source||'';$('feedback').className='feedback hidden';$('next').classList.add('hidden');$('options').innerHTML='';
  q.options.forEach((opt,i)=>{const b=document.createElement('button');b.className='option';const letter=document.createElement('span');letter.className='letter';letter.textContent=String.fromCharCode(65+i);const text=document.createElement('span');text.textContent=opt;b.append(letter,text);b.onclick=()=>answer(i);$('options').appendChild(b);});
}
function answer(choice){
  if(answered)return;answered=true;const q=questions[index],buttons=[...$('options').children];buttons.forEach((b,i)=>{b.disabled=true;if(i===q.answer_index)b.classList.add('correct');if(i===choice&&choice!==q.answer_index)b.classList.add('wrong');});
  const ok=choice===q.answer_index;if(ok)score++;$('scoreText').textContent=`Score ${score}`;$('feedback').textContent=(ok?'✓ Correct. ':'✗ Not quite. ')+(q.explanation||'');$('feedback').className='feedback '+(ok?'good':'bad');$('next').textContent=index===questions.length-1?'See results →':'Next question →';$('next').classList.remove('hidden');
}
$('next').onclick=()=>{if(index===questions.length-1){$('quiz').classList.add('hidden');$('result').classList.remove('hidden');const total=questions.length;$('score').textContent=`${score} / ${total}`;$('accuracy').textContent=Math.round(score/total*100)+'%';$('correct').textContent=score;$('wrong').textContent=total-score;}else{index++;render();}};
</script></body></html>
